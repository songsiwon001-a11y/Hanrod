<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한로드 · Hanrod</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2030;--mu:#6b7084;--ac:#5b5bf0;--ac2:#e9e9ff;--bd:#dfe1ee;--me:#5b5bf0;--metx:#fff;--ok:#1b9a5a;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13141c;--card:#1c1e2b;--tx:#eceefa;--mu:#9a9fb8;--ac:#8a8aff;--ac2:#2a2c45;--bd:#2e3145;--me:#6e6efc;--metx:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13141c;--card:#1c1e2b;--tx:#eceefa;--mu:#9a9fb8;--ac:#8a8aff;--ac2:#2a2c45;--bd:#2e3145;--me:#6e6efc;--metx:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Segoe UI,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;padding:10px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
h1{font-size:18px;margin:0}
.st{font-size:12px;color:var(--mu)}
nav{display:flex;gap:6px;margin-bottom:8px}
nav button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
#log{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);color:var(--metx)}
.m.ai{align-self:flex-start;background:var(--ac2)}
.m small{display:block;color:var(--mu);font-size:11px;margin-top:4px}
.m button{border:0;background:none;color:var(--mu);cursor:pointer;font-size:12px;padding:2px 4px}
.row{display:flex;gap:6px;margin-top:8px}
input,textarea{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.box h3{margin:0 0 6px;font-size:14px}
.box p{margin:0 0 8px;color:var(--mu);font-size:13px}
textarea{min-height:110px;width:100%;resize:vertical}
.scroll{overflow-y:auto;flex:1;min-height:0}
.item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}
.item div{flex:1;word-break:break-word}
.item b{color:var(--ac)}
.item button{border:0;background:none;color:var(--bad);cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header><h1>🧠 한로드 · Hanrod</h1><span class="st" id="stat"></span></header>
<nav>
<button data-t="chat" class="on">💬 대화 Chat</button>
<button data-t="train">📚 학습 Train</button>
<button data-t="data">🗂 지식 Data</button>
</nav>

<section class="pane on" id="chat">
<div id="log"></div>
<div class="row"><input id="inp" placeholder="말을 걸어보세요 · Say something" autocomplete="off"><button class="btn" id="send">보내기</button></div>
</section>

<section class="pane" id="train">
<div class="scroll">
<div class="box"><h3>하나씩 가르치기 · Teach one</h3>
<p>질문과 답을 적으면 바로 배웁니다. · Type a question and its answer.</p>
<div class="row" style="margin:0 0 6px"><input id="tq" placeholder="질문 / Question"></div>
<div class="row" style="margin:0"><input id="ta" placeholder="답 / Answer"><button class="btn" id="tadd">가르치기</button></div></div>
<div class="box"><h3>한꺼번에 가르치기 · Bulk</h3>
<p>한 줄에 하나: <code>질문 =&gt; 답</code> · One per line: <code>question =&gt; answer</code></p>
<textarea id="bulk" placeholder="안녕 => 안녕하세요!&#10;What is your name? => I am Pure AI."></textarea>
<div class="row"><button class="btn" id="badd">일괄 학습</button><span class="st" id="bmsg" style="align-self:center"></span></div></div>
</div>
</section>

<section class="pane" id="data">
<div class="row" style="margin:0 0 8px"><input id="flt" placeholder="검색 / Filter"></div>
<div class="scroll" id="list"></div>
<div class="row"><button class="btn g" id="exp">내보내기</button><button class="btn g" id="imp">불러오기</button><button class="btn g" id="rst" style="color:var(--bad)">초기화</button></div>
<input type="file" id="file" accept=".json" style="display:none">
</section>
</div>

<script>

 var rp=['가위','바위','보'],u=rp.indexOf(n);if(u>=0){var c=Math.floor(Math.random()*3);return '저는 '+rp[c]+'! '+(u===c?'비겼어요.':(u-c+3)%3===1?'제가 졌어요. 🙌':'제가 이겼어요! 😎')}
 if(/^(주사위|주사위 굴려줘|roll a dice|roll dice)$/.test(n))return '🎲 '+(1+Math.floor(Math.random()*6));
 if(/^(동전|동전 던져줘|coin|flip a coin)$/.test(n))return R(['앞면 (heads)','뒷면 (tails)']);
 if(/^[0-9 +*/().x×÷-]+$/.test(t)&&/[0-9]/.test(t)&&/[+*/x×÷-]/.test(t.replace(/^[ -]+/,''))){try{return '= '+Math.round(calc(t.replace(/[x×]/g,'*').replace(/÷/g,'/'))*1e9)/1e9}catch(e){}}
 return null}

function load(){try{var s=localStorage.getItem(KEY);if(s){var j=JSON.parse(s);if(Array.isArray(j)&&j.length){D=j;mergeSeed();return}}}catch(e){}
D=SEED.map(function(p){return{q:p[0],a:p[1]}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}

function norm(t){return String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
function feats(t){
 var f={},ws=norm(t).split(" ").filter(Boolean);
 ws.forEach(function(w){
  add(f,"w:"+w,2);
  var p="<"+w+">";
  for(var n=2;n<=3;n++){for(var i=0;i+n<=p.length;i++)add(f,"c:"+p.substr(i,n),1)}
  if(/[\uAC00-\uD7A3]/.test(w)){for(var k=0;k<w.length;k++)add(f,"s:"+w[k],0.6)}
 });
 return f}
function add(o,k,v){o[k]=(o[k]||0)+v}

function build(){
 idf={};docs=D.map(function(d){return feats(d.q)});
 docs.forEach(function(f){for(var k in f)idf[k]=(idf[k]||0)+1});
 var N=D.length+1;for(var k in idf)idf[k]=Math.log(N/(1+idf[k]))+1;
 docs=docs.map(vec);DJ=D.map(function(d){return jamo(norm(d.q))})}
function vec(f){var v={},s=0;for(var k in f){var x=f[k]*(idf[k]||Math.log(D.length+2)+1);v[k]=x;s+=x*x}
 v._n=Math.sqrt(s)||1;return v}
function cos(a,b){var s=0,x=a._n<b._n?a:b,y=x===a?b:a;for(var k in x){if(k!=="_n"&&y[k])s+=x[k]*y[k]}return s/(a._n*b._n)}

function answer(text){
 if(!D.length)return null;
 var q=vec(feats(text)),best=0,idx=[],tj=jamo(norm(text));
 docs.forEach(function(d,i){var s=Math.max(cos(q,d),fz(tj,i));if(s>best+1e-9){best=s;idx=[i]}else if(Math.abs(s-best)<1e-9)idx.push(i)});
 if(best<0.42)return{score:best};
 var i=idx[Math.floor(Math.random()*idx.length)];
 return{score:best,sim:best,i:i,a:D[i].a,q:D[i].q}}

function isKo(t){return /[\uAC00-\uD7A3]/.test(t)}
function learn(q,a){q=q.trim();a=a.trim();if(!q||!a)return false;
 var dup=D.some(function(d){return norm(d.q)===norm(q)&&d.a===a});if(dup)return false;
 D.push({q:q,a:a});return true}
function commit(){save();build();stat()}
function stat(){var ko=0,en=0;D.forEach(function(d){isKo(d.q)?ko++:en++});
 document.getElementById("stat").textContent="지식 "+D.length+" · 한글 "+ko+" · EN "+en}

var log=document.getElementById("log");
function say(t,who,extra){var m=document.createElement("div");m.className="m "+who;m.textContent=t;
 if(extra)m.appendChild(extra);log.appendChild(m);log.scrollTop=log.scrollHeight;return m}

function wrongBtn(q,i){var s=document.createElement("small"),b=document.createElement("button");
 b.textContent="👎 틀렸어요 / wrong";
 b.onclick=function(){var d=D[i];if(d&&d.q===q.match){D.splice(i,1);commit()}
  pending={q:q.text};b.disabled=true;
  say(isKo(q.text)?"죄송해요. 올바른 답을 알려 주세요.":"Sorry! What should I have said?","ai")};
 s.appendChild(b);return s}

function send(){
 var inp=document.getElementById("inp"),t=inp.value.trim();if(!t)return;inp.value="";
 say(t,"me");if(!pending){var sp=special(t);if(sp){if(sp!=="@")say(sp,"ai");return}}
 if(pending){var p=pending;pending=null;learn(p.q,t);commit();
  say(isKo(p.q)?"배웠어요! 이제 \""+p.q+"\"에 그렇게 대답할게요. 🎓":"Learned! I’ll answer that from now on. 🎓","ai");return}
 var r=answer(t);
 if(r&&r.a!==undefined&&r.sim<0.8&&infoQ(t)){var rr=r;webSearch(t,links(t),false,function(){showAns(rr,t)});return}if(r&&r.a!==undefined){var q={text:t,match:r.q};say((r.sim<0.9&&norm(r.q)!==norm(t)?"(‘"+r.q+"’(으)로 이해했어요)\n":"")+r.a,"ai",wrongBtn(q,r.i))}
 else{pending={q:t};var sl=links(t);webSearch(t,sl);return;say(isKo(t)?"아직 모르는 말이에요. 뭐라고 대답하면 좋을까요? 다음 메시지로 알려 주세요. 아래 검색 링크로 찾은 답을 알려 주셔도 돼요.":"I don’t know that yet. What should I answer? Tell me in your next message. You can use the search links below.","ai",sl)}}

document.getElementById("send").onclick=send;
document.getElementById("inp").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing)send()});

// tabs
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){
 Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(x){x.classList.toggle("on",x===b)});
 Array.prototype.forEach.call(document.querySelectorAll(".pane"),function(p){p.classList.toggle("on",p.id===b.dataset.t)});
 if(b.dataset.t==="data")render()}});

// train
document.getElementById("tadd").onclick=function(){var q=document.getElementById("tq"),a=document.getElementById("ta");
 if(learn(q.value,a.value)){commit();q.value="";a.value="";q.focus()}};
document.getElementById("badd").onclick=function(){var n=0;
 document.getElementById("bulk").value.split("\n").forEach(function(l){var m=l.split(/=>|\|/);if(m.length>=2&&learn(m[0],m.slice(1).join("=>")))n++});
 if(n){commit();document.getElementById("bulk").value=""}
 document.getElementById("bmsg").textContent=n+"개 학습 · learned "+n};

// data
function render(){var f=norm(document.getElementById("flt").value),h=document.getElementById("list");h.innerHTML="";
 D.forEach(function(d,i){if(f&&norm(d.q+" "+d.a).indexOf(f)<0)return;
  var r=document.createElement("div"),c=document.createElement("div"),x=document.createElement("button");
  r.className="item";var b=document.createElement("b");b.textContent="Q ";c.appendChild(b);c.appendChild(document.createTextNode(d.q+"\n"));
  var b2=document.createElement("b");b2.textContent="A ";c.appendChild(b2);c.appendChild(document.createTextNode(d.a));
  x.textContent="✕";x.onclick=function(){D.splice(i,1);commit();render()};r.appendChild(c);r.appendChild(x);h.appendChild(r)})}
document.getElementById("flt").oninput=render;
document.getElementById("exp").onclick=function(){var a=document.createElement("a");
 a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(D,null,1));a.download="pure-ai-knowledge.json";a.click();
 try{navigator.clipboard.writeText(JSON.stringify(D))}catch(e){}};
document.getElementById("imp").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var j=JSON.parse(r.result);j.forEach(function(p){if(p&&p.q&&p.a)learn(p.q,p.a)});commit();render()}catch(x){}};r.readAsText(f)};
document.getElementById("rst").onclick=function(){if(confirm("모든 학습을 지우고 처음 상태로 되돌릴까요?")){
 D=SEED.map(function(p){return{q:p[0],a:p[1]}});commit();render()}};

load();build();stat();
say("안녕하세요! 저는 한로드예요. API 없이 이 페이지 안에서만 배우는 AI예요. 한글과 영어로 말을 걸고, 모르는 건 가르쳐 주세요.\nHi! I’m Hanrod. I learn only inside this page, no API. Talk to me in Korean or English, and teach me what I don’t know.","ai");
})();
</script>
